spring:
   h2:
      console:
         enabled: true
   datasource:
      url: jdbc:h2:mem:testdb
      driver-class-name: org.h2.Driver
      username: sa
      password: null
   jpa:
      hibernate:
         ddl-auto: update

jwt:
   secret: mySecretKeyBCI12345

password:
   regex: ^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$